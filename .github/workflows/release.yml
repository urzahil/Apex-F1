name: Release APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"
        type: string
      version_name:
        description: "Version name, e.g. 1.0.0"
        required: true
        type: string
      version_code:
        description: "Version code, e.g. 1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      F1_API_KEY: ${{ secrets.F1_API_KEY }}
      KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
      - name: Validate secrets
        run: |
          test -n "$F1_API_KEY"
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}"
      - name: Configure API key
        run: printf 'F1_API_KEY=%s\n' "$F1_API_KEY" > .env
      - name: Decode release keystore
        run: |
          printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
      - name: Set release version
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("versionCode = 1", "versionCode = " + os.environ["VERSION_CODE"], 1)
          s = s.replace('versionName = "1.0"', 'versionName = "' + os.environ["VERSION_NAME"] + '"', 1)
          p.write_text(s)
          PY
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apex-f1-release-${{ inputs.version_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
