name: Build Apex-F1 Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      F1_API_KEY: ${{ secrets.F1_API_KEY }}
      KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/apex-f1-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'

      - name: Validate release secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$F1_API_KEY" || { echo "F1_API_KEY secret is not configured"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "RELEASE_KEY_ALIAS secret is not configured"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "RELEASE_STORE_PASSWORD secret is not configured"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "RELEASE_KEY_PASSWORD secret is not configured"; exit 1; }
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "RELEASE_KEYSTORE_BASE64 secret is not configured"; exit 1; }

      - name: Configure API key
        run: printf 'F1_API_KEY=%s\n' "$F1_API_KEY" > .env

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Run unit tests and build signed release APK
        run: gradle clean testDebugUnitTest assembleRelease --no-daemon

      - name: Prepare consistently named APK
        run: |
          set -eu
          mkdir -p dist
          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path" || { echo "No release APK was produced"; exit 1; }
          cp "$apk_path" dist/Apex-F1-release.apk
          test -s dist/Apex-F1-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Apex-F1-release-${{ github.run_number }}
          path: dist/Apex-F1-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Apex-F1-release.apk \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
