name: Temporary Release Build Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-diagnostic:
    runs-on: ubuntu-latest
    env:
      F1_API_KEY: ${{ secrets.F1_API_KEY }}
      KEY_ALIAS: androiddebugkey
      STORE_PASSWORD: android
      KEY_PASSWORD: android
      KEYSTORE_PATH: ${{ github.workspace }}/diagnostic-release.jks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
      - name: Configure API key
        run: printf 'F1_API_KEY=%s\n' "$F1_API_KEY" > .env
      - name: Create diagnostic signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Release Diagnostic"
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace --info
